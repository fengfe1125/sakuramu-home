<style>
/* ============================================
   设计令牌 —— 所有颜色只在这里定义一次，
   下面的样式一律引用变量，改色只需改这一处。
   ============================================ */
:root {
    --paper:       #F4F2EA;               /* 页面底色：暖白纸感 */
    --sheet:       #FBFAF5;               /* 卡片底色：比纸更亮一点 */
    --ink:         #1A1C16;               /* 主文字：带一点绿调的近黑 */
    --ink-soft:    rgba(26, 28, 22, 0.80);/* 次要文字 */
    --ink-faint:   rgba(26, 28, 22, 0.62);/* 最弱的说明文字（仍满足 AA 4.5:1）*/
    --rule:        rgba(26, 28, 22, 0.13);/* 发丝分割线 —— 全站的主角 */
    --rule-strong: rgba(26, 28, 22, 0.26);/* 外框线，比内部分割线重一档 */
    --accent:      #B24E33;               /* 唯一的强调色：陶土红 */
    --grid:        rgba(26, 28, 22, 0.045);/* 背景网格 */
}

/* 跟随系统深色模式：只重新定义变量，下面的样式一行都不用改 */
@media (prefers-color-scheme: dark) {
    :root {
        --paper:       #131410;
        --sheet:       #1A1C15;
        --ink:         #EDEAE0;
        --ink-soft:    rgba(237, 234, 224, 0.82);
        --ink-faint:   rgba(237, 234, 224, 0.58);
        --rule:        rgba(237, 234, 224, 0.14);
        --rule-strong: rgba(237, 234, 224, 0.26);
        --accent:      #E08A6C;
        --grid:        rgba(237, 234, 224, 0.05);
    }
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
    background-color: var(--paper);
    /* 极淡的方格底纹，只留一点点结构感 */
    background-image:
        linear-gradient(var(--grid) 1px, transparent 1px),
        linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 64px 64px;
    color: var(--ink);
    font-family: 'DM Sans', 'Noto Sans SC', -apple-system, sans-serif;
    /* 原来是 height:100vh + overflow:hidden，内容一多就被裁掉；
       改成 min-height 后内容超出会正常滚动 */
    min-height: 100dvh;
    display: grid;
    place-items: center;
    padding: clamp(16px, 4vw, 48px);
    -webkit-font-smoothing: antialiased;
}

/* ============================================
   主卡片 —— 一张用细线框起来的"纸"
   ============================================ */
.sheet {
    width: 100%;
    max-width: 680px;
    background: var(--sheet);
    border: 1px solid var(--rule-strong);
    position: relative;
}

/* 四角的十字标记，制图/建筑图纸的味道 */
.sheet::before,
.sheet::after {
    content: '';
    position: absolute;
    width: 9px;
    height: 9px;
    border: 1px solid var(--rule-strong);
    border-width: 1px 0 0 1px;   /* 只画左上两条边 */
}
.sheet::before { top: -1px;    left: -5px;  transform: translateY(-4px); }
.sheet::after  { bottom: -5px; right: -1px; transform: rotate(180deg) translate(-4px, 0); }

/* ============================================
   顶栏 —— 等宽字体的元信息
   ============================================ */
.meta {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    padding: 14px 24px;
    border-bottom: 1px solid var(--rule);
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.06em;
    color: var(--ink-faint);
}
.meta strong { font-weight: 500; color: var(--ink-soft); }

/* ============================================
   主体
   ============================================ */
.hero { padding: clamp(32px, 7vw, 56px) clamp(24px, 5vw, 40px); }

/* 前导小标签：一根短横线 + 全大写字距拉开的文字 */
.eyebrow {
    display: flex;
    align-items: center;
    gap: 12px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ink-faint);
    margin-bottom: 22px;
}
.eyebrow::before {
    content: '';
    width: 28px;
    height: 1px;
    background: var(--accent);
    flex-shrink: 0;
}

h1 {
    font-family: 'Noto Sans SC', sans-serif;
    font-weight: 900;
    font-size: clamp(3.4rem, 13vw, 5.4rem);
    letter-spacing: -0.05em;   /* 参考站用了极紧的字距 */
    line-height: 0.95;
    margin-bottom: 30px;
}


/* 引言：靠一根竖线撑起来，不用引号也不用背景块 */
.quote {
    border-left: 1px solid var(--rule-strong);
    padding-left: 18px;
    max-width: 46ch;
}
.quote em {
    display: block;
    font-style: normal;
    font-size: 1.3rem;
    font-weight: 500;
    letter-spacing: -0.01em;
    margin-bottom: 8px;
}
.quote small {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.78rem;
    color: var(--ink-faint);
    line-height: 1.7;
}

/* ============================================
   导航列表 —— 每行之间一条细线，这是"线条感"的主体
   ============================================ */
.nav { border-top: 1px solid var(--rule); }

.nav a,
.nav .soon {
    display: flex;
    align-items: baseline;
    gap: 14px;
    padding: 17px clamp(24px, 5vw, 40px);
    border-bottom: 1px solid var(--rule);
    text-decoration: none;
    color: inherit;
    transition: background-color 0.2s, padding-left 0.2s;
}

.nav a:hover {
    background: color-mix(in srgb, var(--accent) 7%, transparent);
    padding-left: calc(clamp(24px, 5vw, 40px) + 8px);
}

.nav .label { font-size: 1rem; font-weight: 500; }

.nav .en {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.72rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--ink-faint);
}

/* 把右侧的箭头/状态推到最右边 */
.nav .tail {
    margin-left: auto;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.72rem;
    letter-spacing: 0.08em;
    color: var(--ink-faint);
}
.nav a:hover .tail { color: var(--accent); }

/* 还没做好的页面：不做成链接，点了不会没反应 */
.nav .soon { cursor: default; }
.nav .soon .label { color: var(--ink-faint); }

/* ============================================
   外链 —— 用细线方块代替图标字体，
   省掉 100KB 的 Font Awesome，也更贴合线条风格
   ============================================ */
.links {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    padding: clamp(24px, 5vw, 32px) clamp(24px, 5vw, 40px);
    border-bottom: 1px solid var(--rule);
}
.links a {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 7px 13px;
    border: 1px solid var(--rule-strong);
    text-decoration: none;
    color: var(--ink-soft);
    font-size: 0.8rem;
    transition: all 0.2s;
}
.links a:hover {
    background: var(--ink);
    border-color: var(--ink);
    color: var(--paper);
}
.links a::after { content: '↗'; font-size: 0.75rem; opacity: 0.5; }
.links a:hover::after { opacity: 1; }

/* ============================================
   底部联系方式
   ============================================ */
.contact {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding: 18px clamp(24px, 5vw, 40px);
    text-decoration: none;
    color: inherit;
    transition: background-color 0.2s;
}
.contact:hover { background: color-mix(in srgb, var(--accent) 7%, transparent); }
.contact .k {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.7rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--ink-faint);
}
.contact .v {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.82rem;
    color: var(--accent);
    word-break: break-all;
}

/* ============================================
   手机端
   ============================================ */
@media (max-width: 520px) {
    body { padding: 12px; background-size: 44px 44px; }
    .meta { font-size: 10px; padding: 12px 20px; }
    .quote { max-width: none; }
    .contact { flex-direction: column; align-items: flex-start; gap: 5px; }
}

/* 尊重"减少动态效果"的系统设置 */
@media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
}
</style>
