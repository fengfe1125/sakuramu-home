<style>
/* base:start */
/* 首页与关于页共用的那一段样式。
 *
 * 为什么能安全抽出来：这 132 行在两个文件里是**逐字相同的开头**，
 * 不是散落各处的相同规则。原样放回原位，源码顺序丝毫不变 ——
 * CSS 靠源码顺序层叠，把散落的规则收拢成一块会悄悄改变同优先级规则的胜负。
 *
 * 由 scripts/build-css.mjs 注入两个页面的 base:start / base:end 之间。
 * 访客拿到的仍然是单个自包含 HTML，不多一次请求。
 * 改样式改这里，两边同时生效；CI 会检查注入结果与源文件一致。
 */
/* ═════ 1. 令牌 ═════
   间距刻度取自 innei.in：3.5/7/14/28/35/42/56/70/105/112px（14px 根字号下的
   0.25rem 倍数）。这里按 16px 根字号等比放大，仍是同一套比例关系。 */
:root {
    --paper:#F4F2EA; --sheet:#FBFAF5; --ink:#1A1C16;
    --ink-soft:rgba(26,28,22,.78); --ink-faint:rgba(26,28,22,.52);
    --rule:rgba(26,28,22,.10); --rule-strong:rgba(26,28,22,.18);
    --accent:#B24E33; --hover:rgba(178,78,51,.06); --chip:rgba(26,28,22,.045);
    --empty:rgba(26,28,22,.06);

    --s1:4px;  --s2:8px;   --s3:16px; --s4:32px;  --s5:40px;
    --s6:48px; --s7:64px;  --s8:80px; --s9:120px; --s10:128px;

    /* 389.17ms 弹簧，25% 处过冲 1.048（devouringdetails 生产环境原值） */
    --spring:linear(0 0%, 0.013389 1%, 0.049373 2%, 0.102262 3%, 0.167133 4%, 0.239788 5%, 0.316716 6%, 0.395034 7%, 0.472432 8%, 0.547109 9%, 0.617715 10%, 0.68329 11%, 0.743204 12%, 0.797107 13%, 0.844877 14%, 0.886576 15%, 0.922409 16%, 0.952689 17%, 0.977806 18%, 0.998202 19%, 1.014346 20%, 1.026718 21%, 1.035795 22%, 1.042036 23%, 1.045879 24%, 1.04773 25%, 1.047962 26%, 1.046909 27%, 1.04487 28%, 1.042104 29%, 1.038837 30%, 1.035258 31%, 1.031524 32%, 1.027766 33%, 1.024084 34%, 1.020558 35%, 1.017245 36%, 1.014186 37%, 1.011406 38%, 1.008919 39%, 1.006726 40%, 1.004821 41%, 1.003194 42%, 1.001828 43%, 1.000702 44%, 0.999796 45%, 0.999085 46%, 0.998548 47%, 0.998162 48%, 0.997904 49%, 0.997755 50%, 0.997695 51%, 0.997707 52%, 0.997776 53%, 0.997887 54%, 0.998029 55%, 0.998192 56%, 0.998368 57%, 0.998548 58%, 0.998728 59%, 0.998903 60%, 0.999069 61%, 0.999224 62%, 0.999366 63%, 0.999495 64%, 0.99961 65%, 0.99971 66%, 0.999797 67%, 0.999871 68%, 0.999932 69%);
    --ease-ui:cubic-bezier(.4,0,.2,1);
}
@media (prefers-color-scheme:dark) {
    :root {
        --paper:#131410; --sheet:#1A1C15; --ink:#EDEAE0;
        --ink-soft:rgba(237,234,224,.80); --ink-faint:rgba(237,234,224,.50);
        --rule:rgba(237,234,224,.11); --rule-strong:rgba(237,234,224,.18);
        --accent:#E08A6C; --hover:rgba(224,138,108,.08); --chip:rgba(237,234,224,.06);
        --empty:rgba(237,234,224,.07);
    }
}

* { margin:0; padding:0; box-sizing:border-box; }

body {
    background:var(--paper); color:var(--ink);
    font-family:'DM Sans','Noto Serif SC',-apple-system,serif;
    font-size:16px; line-height:1.9;
    -webkit-font-smoothing:antialiased;
}

/* ═════ 2. 骨架：居中单栏，靠留白分段而不是靠线 ═════ */
.page { max-width:1120px; margin:0 auto; padding:var(--s7) var(--s5) var(--s10); }
.col  { max-width:760px; }
section { margin-top:var(--s9); }

/* 版块标签：小号等宽大写，和衬线正文拉开层级 */
.label {
    font-family:'JetBrains Mono',monospace; font-size:10.5px; font-weight:400;
    letter-spacing:.16em; text-transform:uppercase; color:var(--ink-faint);
    display:flex; align-items:baseline; gap:var(--s3); margin-bottom:var(--s5);
}
.label::after { content:''; flex:1; height:1px; background:var(--rule); }
.label .zh { font-family:'Noto Serif SC',serif; font-size:.8rem;
    letter-spacing:0; text-transform:none; }

/* ═════ 3. 顶栏 ═════ */
.top { display:flex; align-items:baseline; justify-content:space-between;
    gap:var(--s4); flex-wrap:wrap;
    font-family:'JetBrains Mono',monospace; font-size:11.5px;
    letter-spacing:.04em; color:var(--ink-faint); }
.top a { color:inherit; text-decoration:none; border-bottom:1px solid transparent;
    transition:color .2s var(--ease-ui),border-color .2s var(--ease-ui); }
.top a:hover { color:var(--accent); border-bottom-color:var(--accent); }
.top nav { display:flex; gap:var(--s4); }
.caret { display:inline-block; width:6px; height:1em; margin-left:4px;
    background:var(--accent); vertical-align:-2px; animation:blink 1.2s steps(2) infinite; }
@keyframes blink { 50% { opacity:0 } }

/* ═════ 4. 主视觉：靠上方 120px 留白给份量，不靠字号堆 ═════ */
.hero { margin-top:var(--s9); display:flex; gap:var(--s6); align-items:flex-start; flex-wrap:wrap; }
.hero img { width:104px; height:104px; object-fit:cover; flex-shrink:0; }
.hero .who { flex:1; min-width:260px; }
h1 { font-family:'Noto Serif SC',serif; font-weight:400;
    font-size:clamp(2.8rem,6.4vw,4.4rem); line-height:1.12; letter-spacing:-.02em; }
.handle { font-family:'JetBrains Mono',monospace; font-size:.78rem;
    color:var(--ink-faint); margin-top:var(--s3); letter-spacing:.04em; }
.lede { font-size:1.12rem; color:var(--ink-soft); margin-top:var(--s5); max-width:34em; }
.status { display:none; align-items:center; gap:8px; margin-top:var(--s4);
    font-size:.88rem; color:var(--ink-soft); }
.status.on { display:inline-flex; }
#fx { width:100%; height:132px; display:block; margin-top:var(--s6); opacity:.85; }

/* ═════ 5. 作品：极简列表，发丝线分隔 ═════ */
.work { display:block; padding:var(--s5) 0; border-top:1px solid var(--rule);
    text-decoration:none; color:inherit;
    transition:background-color .2s var(--ease-ui),scale .389s var(--spring); }
.work:hover { background:var(--hover); }
.work:active { scale:.995; }
.wtop { display:flex; align-items:baseline; gap:var(--s3); flex-wrap:wrap; }
.wname { font-family:'Noto Serif SC',serif; font-size:1.24rem; font-weight:400; }
.wmeta { margin-left:auto; display:flex; align-items:center; gap:var(--s3);
    font-family:'JetBrains Mono',monospace; font-size:.64rem; color:var(--ink-faint); }
.sq { width:7px; height:7px; flex-shrink:0; display:inline-block; margin-right:5px; }
.wdesc { font-size:.95rem; line-height:1.95; color:var(--ink-soft);
    margin-top:var(--s2); max-width:56em; }
.tags { display:flex; flex-wrap:wrap; gap:6px; margin-top:var(--s3); }
.tags b { font-family:'JetBrains Mono',monospace; font-weight:400; font-size:.6rem;
    padding:3px 8px; background:var(--chip); color:var(--ink-faint); }
.go { color:var(--ink-faint); transition:transform .2s var(--ease-ui),color .2s var(--ease-ui); }
.work:hover .go { color:var(--accent); transform:translate(3px,-3px); }

/* ═════ 6. 外链：一行文字链，不做卡片 ═════ */
.links { display:flex; flex-wrap:wrap; gap:var(--s3) var(--s6); }
.links a { display:inline-flex; align-items:center; gap:10px; text-decoration:none;
    color:inherit; padding:var(--s2) 0;
    transition:color .2s var(--ease-ui),scale .389s var(--spring); }
.links a:hover { color:var(--accent); }
.links a:active { scale:.97; }
.links svg { width:17px; height:17px; fill:currentColor; opacity:.7; }
.links .t { font-size:.95rem; }
.links .h { font-family:'JetBrains Mono',monospace; font-size:.64rem; color:var(--ink-faint); }

/* ═════ 7. Token 统计 ═════ */
.tkstats { display:grid; grid-template-columns:repeat(3,1fr);
    gap:var(--s7) var(--s5); margin-bottom:var(--s8); }
.stat b { display:block; font-family:'Noto Serif SC',serif; font-weight:400;
    font-size:clamp(1.7rem,3.4vw,2.4rem); line-height:1.1;
    letter-spacing:-.02em; font-variant-numeric:tabular-nums; }
.stat span { display:block; margin-top:10px; font-family:'JetBrains Mono',monospace;
    font-size:.6rem; letter-spacing:.12em; text-transform:uppercase; color:var(--ink-faint); }

.tkhead { display:flex; align-items:baseline; gap:var(--s3); margin-bottom:var(--s4); }
.vh { font-family:'JetBrains Mono',monospace; font-size:10.5px; letter-spacing:.14em;
    text-transform:uppercase; color:var(--ink-faint); }
.tkviews { margin-left:auto; display:flex; gap:var(--s1); }
.tkviews button { font-family:'JetBrains Mono',monospace; font-size:.62rem;
    padding:4px 9px; background:none; color:var(--ink-faint); letter-spacing:.04em;
    border:0; border-bottom:1px solid transparent; cursor:pointer;
    transition:color .2s var(--ease-ui),border-color .2s var(--ease-ui); }
.tkviews button:hover { color:var(--ink-soft); }
.tkviews button[aria-selected="true"] { color:var(--accent); border-bottom-color:var(--accent); }

/* 行高、列宽、间隙由 JS 按可用宽度算（见 drawMap）；
   塞不下时 .tkscroll 自己横向滚动，整页绝不出现横向滚动条。 */
.tkscroll { overflow-x:auto; overflow-y:hidden; }
.tkgrid { display:grid; grid-auto-flow:column; gap:3px; }
/* base:end */
.tkgrid i { background:var(--empty); transition:background-color .5s var(--ease-ui),
            outline-color .15s var(--ease-ui); outline:1px solid transparent; outline-offset:1px; }
.tkgrid i:not(.pad):hover { outline-color:var(--accent); }

/* 入场：按列交错。默认可见，只有确定要播时才加 .anim ——
   动画不能是内容可见的前提（后台标签页里动画会被挂起）。 */
@keyframes cellIn { from { opacity:0; transform:scale(.55) } }
.tkgrid.anim i { animation:cellIn .45s var(--ease-ui) both;
    animation-delay:calc(var(--c) * 11ms); }

/* 悬浮提示：跟随光标，取代浏览器原生 title（原生的延迟久、样式不可控） */
.tip { position:fixed; z-index:30; pointer-events:none; opacity:0;
    background:var(--sheet); color:var(--ink); border:1px solid var(--rule-strong);
    padding:9px 12px; font-family:'JetBrains Mono',monospace; font-size:.66rem;
    line-height:1.8; white-space:nowrap;
    box-shadow:0 8px 24px rgba(0,0,0,.10);
    transition:opacity .15s var(--ease-ui); }
.tip.on { opacity:1; }
.tip b { display:block; font-weight:500; font-size:.78rem; color:var(--accent);
    font-variant-numeric:tabular-nums; }
.tkgrid i.l1 { background:color-mix(in srgb,var(--accent) 32%,transparent); }
.tkgrid i.l2 { background:color-mix(in srgb,var(--accent) 64%,transparent); }
.tkgrid i.l3 { background:var(--accent); }
.tkgrid i.pad { visibility:hidden; }
.tkmonths { display:grid; gap:3px; margin-top:9px; overflow:hidden;
    font-family:'JetBrains Mono',monospace; font-size:.58rem; color:var(--ink-faint); }
.tkmonths span { white-space:nowrap; }
.tkfoot { display:flex; align-items:center; gap:var(--s2); margin-top:var(--s3);
    font-family:'JetBrains Mono',monospace; font-size:.62rem; color:var(--ink-faint); }
.tkscale { display:flex; align-items:center; gap:3px; margin-left:auto; }
.tkscale i { width:9px; height:9px; background:var(--empty); }
.tkscale i.l1 { background:color-mix(in srgb,var(--accent) 32%,transparent); }
.tkscale i.l2 { background:color-mix(in srgb,var(--accent) 64%,transparent); }
.tkscale i.l3 { background:var(--accent); }
.tkcap { margin-top:var(--s3); font-family:'JetBrains Mono',monospace;
    font-size:.6rem; line-height:1.9; color:var(--ink-faint); max-width:52em; }

/* 单列：7 项排 2 列必然剩一个孤儿，怎么排都不对称 */
.tkagents { display:grid; grid-template-columns:1fr; gap:var(--s4); margin-top:var(--s8); }
.tkagent { display:grid; grid-template-columns:1fr auto; gap:6px var(--s2); align-items:baseline; }
.tkagent .n { font-family:'JetBrains Mono',monospace; font-size:.7rem; color:var(--ink-soft); }
.tkagent .v { font-family:'JetBrains Mono',monospace; font-size:.64rem; color:var(--ink-faint);
    font-variant-numeric:tabular-nums; }
.wbar { grid-column:1 / -1; height:2px; background:var(--rule); position:relative; }
.wbar i { position:absolute; inset:0 auto 0 0; width:0;
    background:color-mix(in srgb,var(--accent) 55%,transparent);
    transition:width .9s cubic-bezier(.2,.7,.3,1); }

/* ═════ 9. 页脚 ═════ */
.foot { margin-top:var(--s10); padding-top:var(--s6); border-top:1px solid var(--rule);
    display:flex; align-items:baseline; justify-content:space-between; gap:var(--s4);
    flex-wrap:wrap; }
.foot .fl { display:flex; align-items:baseline; gap:var(--s3); flex-wrap:wrap; }
.foot .k { font-family:'JetBrains Mono',monospace; font-size:.62rem;
    letter-spacing:.14em; text-transform:uppercase; color:var(--ink-faint); }
.foot a { font-family:'JetBrains Mono',monospace; font-size:.86rem;
    color:var(--accent); text-decoration:none;
    border-bottom:1px solid transparent; transition:border-color .2s var(--ease-ui); }
.foot a:hover { border-bottom-color:var(--accent); }

/* ═════ 10. 揭示动画 ═════
   只做 blur + 透明度，不做位移（位移会让整页滚动时抖一下）。
   参数同 devouringdetails：blur(6px)→0，.75s ease。 */
.js .reveal { opacity:0; filter:blur(6px);
    transition:opacity .75s ease,filter .75s ease,
               background-color .2s var(--ease-ui),scale .389s var(--spring); }
.js .reveal.in { opacity:1; filter:blur(0); }

@keyframes fadeInBlur { to { opacity:1; filter:blur(0); } }
.w { display:inline-block; }
.pre .w { opacity:0; filter:blur(6px); }
.pre.lit .w { animation:fadeInBlur .75s ease both; animation-delay:calc(var(--i) * 45ms); }

@media (max-width:900px) {
    .page { padding:var(--s5) var(--s4) var(--s8); }
    section { margin-top:var(--s8); }
    .hero { margin-top:var(--s7); gap:var(--s5); }
    .tkstats { grid-template-columns:repeat(2,1fr); gap:var(--s6) var(--s4); }
}

@media (prefers-reduced-motion:reduce) {
    *,*::before,*::after { animation:none !important; transition:none !important; }
    .js .reveal { opacity:1 !important; filter:none !important; }
    .pre .w { opacity:1 !important; filter:none !important; animation:none !important; }
    .work:active,.links a:active { scale:1 !important; }
}
</style>

        return '<div class="stat"><b data-count="' + v + '" data-fmt="' + fmt + '">' +
               esc(fmtV(v, fmt)) + '</b><span>' + esc(label) + '</span></div>';
    }

    function renderTokens(d) {
        tkData = d;
        var t = d.totals, b = d.longest_burst;
        document.getElementById('tk-stats').innerHTML =
            tkStat(t.tokens, 'tokens', '累计 Token') +
            tkStat(d.peak ? d.peak.tokens : 0, 'tokens', '峰值 Token') +
            tkStat(b ? b.seconds : 0, 'dur', '最长聊天时长') +
            tkStat(d.streak.current, 'days', '当前连续') +
            tkStat(d.streak.longest, 'days', '最长连续') +
            tkStat(t.cost_usd, 'usd', '估算成本');

        var agents = d.agents || [], max = 0, i;
        for (i = 0; i < agents.length; i++) max = Math.max(max, agents[i].tokens);
        document.getElementById('tk-agents').innerHTML = agents.map(function (a) {
            var pct = max ? Math.round(a.tokens / max * 100) : 0;
            return '<div class="tkagent"><span class="n">' + esc(AGENT_NAME[a.id] || a.id) +
                '</span><span class="v">' + fmtT(a.tokens) + '</span>' +
                '<span class="wbar"><i data-w="' + pct + '"></i></span></div>';
        }).join('') || '<span class="v">暂无数据</span>';

        drawMap();

        // observe() 只观察 .reveal:not(.in)，所以砖一旦露出过，后续重渲染
        // 换上的新节点就再也不会被 revealNow 处理 —— countUp 不跑、进度条不填。
        // 对已经 reveal 过的砖直接补跑一次。
        ['tk-stats', 'tk-agents'].forEach(function (id) {
            var el = document.getElementById(id);
            var tile = el && el.closest ? el.closest('.reveal') : null;
            if (tile && tile.classList.contains('in')) revealNow(tile);
        });
    }

    /* 每日=非零值三分位；每周=整列同色、在周合计上重算分位；
       累计=占最终总量的比例固定四分带（单调序列上分位数没有意义）。 */
    function drawMap() {
        var d = tkData, days = d.daily.tokens, start = d.daily.start, n = days.length;
        if (!n) return;
        var lead = weekdayMon(start), trail = (7 - ((lead + n) % 7)) % 7;
        var cols = (lead + n + trail) / 7, i;

        var vals = [], run = [], acc = 0;
        for (i = 0; i < n; i++) { acc += days[i]; run.push(acc); if (days[i] > 0) vals.push(days[i]); }
        vals.sort(function (a, b) { return a - b; });

        var weekly = [];
        for (i = 0; i < n; i++) { var c = ((lead + i) / 7) | 0; weekly[c] = (weekly[c] || 0) + days[i]; }
        var wsorted = weekly.filter(function (v) { return v > 0; }).sort(function (a, b) { return a - b; });

        function cut(list, p) {
            return list.length ? list[Math.min(list.length - 1, Math.floor(p * list.length))] : 0;
        }
        var d1 = cut(vals, 1 / 3), d2 = cut(vals, 2 / 3);
        var w1 = cut(wsorted, 1 / 3), w2 = cut(wsorted, 2 / 3);
        var total = run[n - 1] || 1;

        function level(idx) {
            var v;
            if (tkView === 'daily') {
                v = days[idx];
                return v <= 0 ? 0 : v <= d1 ? 1 : v <= d2 ? 2 : 3;
            }
            if (tkView === 'weekly') {
                v = weekly[((lead + idx) / 7) | 0] || 0;
                return v <= 0 ? 0 : v <= w1 ? 1 : v <= w2 ? 2 : 3;
            }
            var r = run[idx] / total;
            return r < .25 ? 0 : r < .5 ? 1 : r < .75 ? 2 : 3;
        }
        function tip(idx) {
            var day = addDays(start, idx);
            if (tkView === 'weekly') {
                return { d: day + ' 所在周', v: fmtT(weekly[((lead + idx) / 7) | 0] || 0) };
            }
            if (tkView === 'cumul') {
                return { d: '截至 ' + day,
                         v: fmtT(run[idx]) + '（' + Math.round(run[idx] / total * 100) + '%）' };
            }
            return { d: day, v: days[idx] > 0 ? fmtT(days[idx]) : '没有记录' };
        }

        var html = '', k;
        for (k = 0; k < lead; k++) html += '<i class="pad" style="--c:0"></i>';
        for (i = 0; i < n; i++) {
            var lv = level(i);
            // 不用原生 title：延迟久、样式不可控。改由 #tk-tip 跟随光标显示。
            // --c 是列序号，入场动画按列交错。
            html += '<i class="' + (lv ? 'l' + lv : '') + '" style="--c:' + (((lead + i) / 7) | 0)
                 + '" data-d="' + esc(tip(i).d) + '" data-v="' + esc(tip(i).v) + '"></i>';
        }
        for (k = 0; k < trail; k++) html += '<i class="pad" style="--c:' + (cols - 1) + '"></i>';
        var grid = document.getElementById('tk-grid');
        var wrap = document.getElementById('tk-scroll');
        // 先按 3px 间隙试算格子边长；塞不下就收窄间隙。仍低于 7px 说明这个宽度
        // 根本放不下整年，那就不必再缩 —— 横竖要滚动，不如给个看得清的 11px，
        // 由 .tkscroll 消化多出来的宽度。窄屏首屏加载与从宽屏缩放的结果因此一致。
        // 列宽用 1fr 精确铺满容器（取整会在右边留下几十像素空白），
        // 行高取同一个小数值，格子因此仍是正方形。
        var avail = wrap.clientWidth || 640, gap = 3;
        var cell = (avail - (cols - 1) * gap) / cols;
        if (cell < 7) { gap = 2; cell = (avail - (cols - 1) * gap) / cols; }
        var fits = cell >= 7;
        if (!fits) { gap = 3; cell = 11; }   // 塞不下就固定 11px，交给 .tkscroll 横向滚动
        grid.style.gap = gap + 'px';
        grid.style.gridTemplateRows = 'repeat(7,' + cell.toFixed(2) + 'px)';
        grid.style.gridAutoColumns = fits ? 'minmax(0,1fr)' : cell + 'px';
        grid.innerHTML = html;
        if (!tkAnimated && !still && !document.hidden) {
            tkAnimated = true;
            grid.classList.add('anim');
            setTimeout(function () { grid.classList.remove('anim'); }, 1400);
        }
        grid.setAttribute('aria-label', '从 ' + start + ' 到 ' + d.range.to + ' 的每日 Token 用量，共 ' +
            n + ' 天，累计 ' + fmtT(d.daily.window_tokens));

        var months = document.getElementById('tk-months'), mh = '', last = '';
        months.style.gap = gap + 'px';
        months.style.gridTemplateColumns = 'repeat(' + cols + ','
            + (fits ? 'minmax(0,1fr)' : cell + 'px') + ')';
        for (var c = 0; c < cols; c++) {
            var first = c * 7 - lead; if (first < 0) first = 0;
            var m = first < n ? addDays(start, first).slice(5, 7) : '';
            // 只在该列确实落在新月份、且后面还有至少两列时才标，避免末尾挤字
            if (m && m !== last && c < cols - 1) { mh += '<span>' + (+m) + '月</span>'; last = m; }
            else { if (m) last = last || m; mh += '<span></span>'; }
        }
        months.innerHTML = mh;

        document.getElementById('tk-range').textContent =
            d.range.from + ' → ' + d.range.to + ' · ' + d.totals.active_days + ' 天活跃';
        document.getElementById('tk-scale').innerHTML = tkView === 'cumul'
            ? '0%<i></i><i class="l1"></i><i class="l2"></i><i class="l3"></i>100%'
            : '少<i></i><i class="l1"></i><i class="l2"></i><i class="l3"></i>多';
        document.getElementById('tk-cap').textContent = tkView === 'daily'
            ? '每格一天，按非零日用量的三分位着色 —— 峰值是地板的数百倍，线性着色会让绝大多数天变成空白。'
            : tkView === 'weekly'
            ? '整列同色，一列读作一周的合计；分位在周合计上重算，回答的是「哪几周重」。'
            : '按累计量占最终总量的比例分四段：0–25% / 25–50% / 50–75% / 75–100%。带越窄说明那段时间涨得越猛。';
    }

    /* 悬浮提示：整块网格挂一个监听（371 个格子逐个挂太重），
       靠事件冒泡取 e.target 判断落在哪个格子上。
       定位是同步做的，不走 requestAnimationFrame —— rAF 在后台标签页会被挂起，
       那样提示会显示出来却停在左上角。mousemove 本身已被浏览器限频，
       每次写两个样式属性的开销可以接受。 */
    (function tooltip() {
        var tip = document.getElementById('tk-tip');
        var grid = document.getElementById('tk-grid');
        if (!tip || !grid) return;

        function hide() { tip.classList.remove('on'); }

        grid.addEventListener('mousemove', function (e) {
            var cell = e.target;
            if (cell.tagName !== 'I' || !cell.dataset.d) { hide(); return; }
            tip.innerHTML = '<b>' + esc(cell.dataset.v) + '</b>' + esc(cell.dataset.d);
            tip.classList.add('on');
            var r = tip.getBoundingClientRect();
            var x = e.clientX + 14, y = e.clientY + 16;
            if (x + r.width > innerWidth - 8) x = e.clientX - r.width - 14;
            if (y + r.height > innerHeight - 8) y = e.clientY - r.height - 16;
            tip.style.left = Math.max(8, x) + 'px';
            tip.style.top = Math.max(8, y) + 'px';
        });
        grid.addEventListener('mouseleave', hide);
        addEventListener('scroll', hide, { passive: true });
    })();

    document.getElementById('tk-views').addEventListener('click', function (e) {
        var btn = e.target.closest ? e.target.closest('button[data-view]') : null;
        if (!btn || !tkData) return;
        tkView = btn.dataset.view;
        var all = this.querySelectorAll('button[data-view]');
        for (var i = 0; i < all.length; i++) {
            all[i].setAttribute('aria-selected', all[i] === btn ? 'true' : 'false');
        }
        drawMap();
    });

    renderTokens(TOKENS_SNAPSHOT);

    var tkResizeTimer = null;
    addEventListener('resize', function () {
        if (!tkData) return;
        clearTimeout(tkResizeTimer);
        tkResizeTimer = setTimeout(drawMap, 150);
    });

    /* 覆盖快照；取不到就静默留在快照上，绝不让统计服务拖垮首页 */
    (function () {
        try {
            var c = JSON.parse(localStorage.getItem(TK_KEY) || 'null');
            if (c && Date.now() - c.t < TK_TTL && c.d && c.d.v === 1) {
                renderTokens(c.d); observe(); return;
            }
        } catch (e) {}
        // no-cache = 强制回源校验。本域 Browser Cache TTL 是 4 小时，会覆盖源站的
        // max-age=60；命中 ETag 时返回 304，几乎不产生流量。与上面 status.json 同款写法。
        fetch('https://tt.sakuramu.edu.kg/v1/stats/sakuramu', { cache: 'no-cache' })
            .then(function (r) { return r.ok ? r.json() : null; })
            .then(function (d) {
                if (!d || d.v !== 1 || !d.daily || !d.daily.tokens.length) return;
                renderTokens(d); observe();
                try { localStorage.setItem(TK_KEY, JSON.stringify({ t: Date.now(), d: d })); } catch (e) {}
            }).catch(function () {});
    })();

    renderAll(PROJECTS);
    document.querySelectorAll('[data-count]').forEach(countUp);

    setTimeout(function () {
        if (fired || still) return;
        document.querySelectorAll('.reveal:not(.in)').forEach(revealNow);
    }, 2500);

    /* ── GitHub 实时数据覆盖星标与更新时间 ── */
    var KEY = 'gh-v3', TTL = 6 * 3600 * 1000;
    function cached() {
        try { var c = JSON.parse(localStorage.getItem(KEY));
              return c && Date.now() - c.t < TTL ? c.d : null; } catch (e) { return null; }
    }
    function merge(live) {
        var by = {}; live.forEach(function (r) { by[r.n] = r; });
        var out = PROJECTS.map(function (p) {
            var m = by[p.n];
            return m ? { n:p.n, t:p.t, d:p.d, g:p.g, l:m.l || p.l, s:m.s, p:m.p } : p;
        });
        live.forEach(function (r) {
            if (!PROJECTS.some(function (p) { return p.n === r.n; }) && r.d) {
                out.push({ n:r.n, t:r.n, d:r.d, g:[], l:r.l, s:r.s, p:r.p });
            }
        });
        out.sort(function (a, b) { return new Date(b.p) - new Date(a.p); });
        renderAll(out);
        document.querySelectorAll('.work').forEach(function (e) { e.classList.add('in'); });
        fill(document);
    }
    var c = cached();
    if (c) merge(c);
    else {
        fetch('https://api.github.com/users/fengfe1125/repos?sort=pushed&per_page=100')
            .then(function (r) { return r.ok ? r.json() : Promise.reject(0); })
            .then(function (raw) {
                var live = raw.filter(function (x) { return !x.fork && !x.archived && x.name !== 'sakuramu-home'; })
                    .map(function (x) { return { n:x.name, d:x.description, l:x.language, s:x.stargazers_count, p:x.pushed_at }; });
                try { localStorage.setItem(KEY, JSON.stringify({ t:Date.now(), d:live })); } catch (e) {}
                merge(live);
            }).catch(function () {});
    }
})();
</script>

<script>
/* 四维超立方体（tesseract）线框投影
   16 个顶点取遍 (±1,±1,±1,±1)，两顶点只差一个坐标符号时相连，共 32 条棱。
   先在 XW / YZ / XY 三个平面上做 4D 旋转，再 4D→3D→2D 两次透视投影，
   按投影深度调节每条棱的透明度，产生"由内向外翻出来"的错觉。 */
(function () {
    'use strict';
    var cv = document.getElementById('fx');
    if (!cv || !cv.getContext) return;
    var ctx = cv.getContext('2d'), tile = cv.parentElement;
    var still = matchMedia('(prefers-reduced-motion: reduce)').matches;

    var V = [], i;
    for (i = 0; i < 16; i++) V.push([(i&1)?1:-1, (i&2)?1:-1, (i&4)?1:-1, (i&8)?1:-1]);
    var E = [];
    for (var a = 0; a < 16; a++) for (var b = a + 1; b < 16; b++) {
        var d = a ^ b;
        if (d && (d & (d - 1)) === 0) E.push([a, b]);   // 异或结果是 2 的幂 = 只差一位
    }

    // 跟随主题取色
    var rgb = [178, 78, 51];
    function readColor() {
        var h = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim().replace('#', '');
        if (h.length === 3) h = h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
        var n = parseInt(h, 16);
        if (!isNaN(n)) rgb = [(n >> 16) & 255, (n >> 8) & 255, n & 255];
    }
    readColor();
    var mq = matchMedia('(prefers-color-scheme: dark)');
    if (mq.addEventListener) mq.addEventListener('change', readColor);
    else if (mq.addListener) mq.addListener(readColor);

    var W = 1, H = 1;
    function resize() {
        var dpr = Math.min(window.devicePixelRatio || 1, 2), r = tile.getBoundingClientRect();
        W = Math.max(r.width, 1); H = Math.max(r.height, 1);
        cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    resize();
    if ('ResizeObserver' in window) new ResizeObserver(resize).observe(tile);
    else addEventListener('resize', resize);

    function spin(p, i, j, ang) {
        var c = Math.cos(ang), s = Math.sin(ang), x = p[i], y = p[j];
        p[i] = x * c - y * s; p[j] = x * s + y * c;
    }

    function draw(t) {
        ctx.clearRect(0, 0, W, H);
        var S = Math.min(W, H) * 0.75, cx = W / 2, cy = H / 2;
        // 0.75 由完整旋转周期扫描得出：归一化最大半径 0.5726，
        // 0.75 × 0.5726 × 2 ≈ 86% 边长，两侧各留 7% 余量不会裁切
        var pts = V.map(function (v) {
            var p = v.slice();
            spin(p, 0, 3, t * 0.00045);   // XW
            spin(p, 1, 2, t * 0.00033);   // YZ
            spin(p, 0, 1, t * 0.00018);   // XY
            var k  = 1 / (2.6 - p[3]);                       // 4D → 3D
            var k2 = 1 / (2.4 - p[2] * k);                   // 3D → 2D
            return { x: cx + p[0] * k * k2 * S, y: cy + p[1] * k * k2 * S, d: k * k2 };
        });

        ctx.lineWidth = 1;
        E.forEach(function (e) {
            var A = pts[e[0]], B = pts[e[1]];
            var al = Math.max(0.08, Math.min(0.9, ((A.d + B.d) / 2 - 0.05) * 1.35));
            ctx.strokeStyle = 'rgba(' + rgb[0] + ',' + rgb[1] + ',' + rgb[2] + ',' + al.toFixed(3) + ')';
            ctx.beginPath(); ctx.moveTo(A.x, A.y); ctx.lineTo(B.x, B.y); ctx.stroke();
        });
        pts.forEach(function (p) {
            var al = Math.max(0.15, Math.min(1, (p.d - 0.05) * 1.6));
            ctx.fillStyle = 'rgba(' + rgb[0] + ',' + rgb[1] + ',' + rgb[2] + ',' + al.toFixed(3) + ')';
            ctx.fillRect(p.x - 1.3, p.y - 1.3, 2.6, 2.6);
        });
    }

    // 开了"减少动态效果"就只画一帧静态图
    if (still) { draw(0); return; }

    var raf = null, onScreen = true, t0 = performance.now();
    function loop(now) { draw(now - t0); raf = requestAnimationFrame(loop); }
    function play() { if (!raf && onScreen && !document.hidden) raf = requestAnimationFrame(loop); }
    function stop() { if (raf) { cancelAnimationFrame(raf); raf = null; } }

    // 滚出视口或切到后台就停，不空转耗电
    if ('IntersectionObserver' in window) {
        new IntersectionObserver(function (es) {
            onScreen = es[0].isIntersecting;
            onScreen ? play() : stop();
        }, { threshold: 0 }).observe(tile);
    }
    document.addEventListener('visibilitychange', function () { document.hidden ? stop() : play(); });
    play();
})();
</script>
<script>
/* beacon:start */
/* 访客埋点。由 scripts/build-shared.mjs 注入两个页面的 beacon:start / beacon:end 之间。
 *
 * 两个页面共用这一份，不能各写一份 —— 刚为 CSS 去过一次重，同样的理由：
 * 分叉的表现是「一个站的数字对，另一个站悄悄不对」。
 *
 * 隐私：不写 Cookie、不写 localStorage、不发 IP、不发 User-Agent。
 * referrer 只取主机名，查询串根本不出浏览器。
 * 下面那个 id 只为把「离开」事件对上「进入」那一行，
 * 存在内存里、刷新即变、不落盘，不能用来识别人。
 *
 * 上报全程 fire-and-forget：失败静默，不重试，不打扰页面。
 * 统计服务挂了，访客什么都感觉不到。
 */
(function () {
    var EP = 'https://hits.sakuramu.edu.kg/e';
    var MAX_SENDS = 3;

    /* 尊重 Do Not Track 与 Global Privacy Control。
       既然整套设计都是「能不收就不收」，这两个信号没有理由不听。 */
    try {
        if (navigator.doNotTrack === '1' || window.doNotTrack === '1' ||
            navigator.globalPrivacyControl === true) return;
    } catch (e) { /* 读不到就当没设 */ }

    var id = '';
    try {
        var a = new Uint8Array(12);
        crypto.getRandomValues(a);
        for (var i = 0; i < a.length; i++) id += (a[i] % 36).toString(36);
    } catch (e) {
        id = Math.random().toString(36).slice(2) + Math.random().toString(36).slice(2);
    }
    id = id.replace(/[^a-z0-9]/g, '').slice(0, 24);
    if (id.length < 8) return;

    function post(payload) {
        var body = JSON.stringify(payload);
        try {
            /* sendBeacon 在页面被销毁时仍能发出去，这是它存在的全部理由。
               注意它同样受 CSP 的 connect-src 管 —— 漏配就静默失败。 */
            /* 必须用 text/plain。用 application/json 会把这次上报变成「非简单请求」，
               于是浏览器先发一个 OPTIONS 预检 —— 而 pagehide 期间预检往往跑不完，
               结果是离开信标整个丢掉，而且只在移动端丢，桌面上测不出来。
               服务端按 JSON 解析正文，不看 content-type，所以这样发没有损失。 */
            if (navigator.sendBeacon &&
                navigator.sendBeacon(EP, new Blob([body], { type: 'text/plain;charset=UTF-8' }))) return;
        } catch (e) { /* 落到下面的 fetch */ }
        try {
            /* 同理：content-type 用 text/plain，且 credentials:'omit' ——
               这个端点不认 Cookie，没有理由让它带上任何凭据。 */
            fetch(EP, { method: 'POST', body: body, keepalive: true, credentials: 'omit',
                        headers: { 'content-type': 'text/plain;charset=UTF-8' } })['catch'](function () {});
        } catch (e) { /* 静默 */ }
    }

    /* referrer 只取主机名。完整 URL 的查询串常常带着隐私，不该离开浏览器。 */
    var ref = '';
    try {
        if (document.referrer) {
            var h = new URL(document.referrer).hostname;
            if (h && h !== location.hostname) ref = h;
        }
    } catch (e) { /* 解析不了就不发 */ }

    post({ t: 'view', id: id, p: location.pathname.slice(0, 200), r: ref });

    /* ── 停留时长：累计「可见时长」，不是墙上时间 ──
       用户切走再切回来，中间那段不算 —— 那才是「看了多久」。 */
    var acc = 0, mark = 0, sends = 0;
    function visible() { return document.visibilityState !== 'hidden'; }
    if (visible()) mark = Date.now();

    var lastSent = -1;
    function flush() {
        if (sends >= MAX_SENDS) return;
        if (mark) { acc += Date.now() - mark; mark = 0; }
        /* visibilitychange 和 pagehide 常常同时触发。第二发在服务端会因为
           「时长没变大」而写 0 行，但没必要白跑一趟网络。 */
        if (acc - lastSent < 1000) return;
        lastSent = acc;
        sends++;
        post({ t: 'end', id: id, d: Math.min(acc, 86400000) });
    }

    /* visibilitychange 是首选：beforeunload / unload 在移动端极不可靠，
       而且带 unload 处理器的页面会被排除在 bfcache 之外。
       pagehide 兜底（它与 bfcache 兼容）。服务端 last-write-wins，重复发不会算重。 */
    document.addEventListener('visibilitychange', function () {
        if (visible()) { if (!mark) mark = Date.now(); }
        else flush();
    });
    window.addEventListener('pagehide', flush);

    /* 从 bfcache 恢复：继续用同一个 id 累计，不算一次新访问。 */
    window.addEventListener('pageshow', function (e) {
        if (e.persisted && visible() && !mark) mark = Date.now();
    });
})();
/* beacon:end */
</script>
</body>
