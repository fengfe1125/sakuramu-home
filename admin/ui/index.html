<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>后台 · 沐枫</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&family=JetBrains+Mono:wght@400;500&family=Noto+Serif+SC:wght@300;400;500&display=swap" rel="stylesheet">
<style>
/* 令牌逐字取自 public/index.html —— 后台和站点是同一套观感，零圆角。 */
:root {
    --paper:#F4F2EA; --sheet:#FBFAF5; --ink:#1A1C16;
    --ink-soft:rgba(26,28,22,.78); --ink-faint:rgba(26,28,22,.52);
    --rule:rgba(26,28,22,.10); --rule-strong:rgba(26,28,22,.18);
    --accent:#B24E33; --hover:rgba(178,78,51,.06); --chip:rgba(26,28,22,.045);
    --empty:rgba(26,28,22,.09);

    /* 后台新增：站点本体没有状态色和表单色 */
    --ok:#4E7A52; --warn:#B8894A;
    --field-bg:var(--sheet); --field-border:var(--rule-strong);

    --s1:4px; --s2:8px; --s3:16px; --s4:32px; --s5:40px;
    --s6:48px; --s7:64px; --s8:80px;
    --ease-ui:cubic-bezier(.4,0,.2,1);
}
@media (prefers-color-scheme:dark) {
    :root {
        --paper:#131410; --sheet:#1A1C15; --ink:#EDEAE0;
        --ink-soft:rgba(237,234,224,.80); --ink-faint:rgba(237,234,224,.50);
        --rule:rgba(237,234,224,.11); --rule-strong:rgba(237,234,224,.18);
        --accent:#E08A6C; --hover:rgba(224,138,108,.08); --chip:rgba(237,234,224,.06);
        --empty:rgba(237,234,224,.10);
        --ok:#7FA982; --warn:#D0A96B;
    }
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
    background:var(--paper); color:var(--ink);
    font-family:'DM Sans','Noto Serif SC',-apple-system,serif;
    font-size:16px; line-height:1.9; -webkit-font-smoothing:antialiased;
}
.wrap { max-width:820px; margin:0 auto; padding:var(--s7) var(--s4) var(--s8); }

header { border-bottom:1px solid var(--rule); padding-bottom:var(--s4); }
h1 { font-size:22px; font-weight:500; letter-spacing:-.01em; }
.sub { color:var(--ink-faint); font-size:14px; margin-top:var(--s1); }

nav { display:flex; gap:var(--s4); margin-top:var(--s5); flex-wrap:wrap; }
nav button {
    font:inherit; font-size:14px; background:none; border:0; cursor:pointer;
    color:var(--ink-faint); padding:0 0 var(--s1); border-bottom:1px solid transparent;
    transition:color .2s var(--ease-ui), border-color .2s var(--ease-ui);
}
nav button:hover { color:var(--ink-soft); }
nav button.on { color:var(--ink); border-bottom-color:var(--accent); }

.panel { margin-top:var(--s6); }
h2 { font-size:13px; font-weight:500; letter-spacing:.08em; text-transform:uppercase;
     color:var(--ink-faint); margin-bottom:var(--s3); }

.row { display:flex; justify-content:space-between; align-items:baseline; gap:var(--s3);
       padding:var(--s2) 0; border-bottom:1px solid var(--rule); font-size:15px; }
.row:last-child { border-bottom:0; }
.k { color:var(--ink-soft); }
.v { font-family:'JetBrains Mono',ui-monospace,monospace; font-size:13px; color:var(--ink); }
.v.ok { color:var(--ok); } .v.bad { color:var(--accent); } .v.warn { color:var(--warn); }

/* ── 监控卡片 ── */
.mon { padding:var(--s4) 0; border-bottom:1px solid var(--rule); }
.mon:last-child { border-bottom:0; }
.mon-top { display:flex; align-items:baseline; justify-content:space-between; gap:var(--s3); }
.mon-name { font-size:17px; font-weight:500; display:flex; align-items:baseline; gap:var(--s2); }
.dot { width:8px; height:8px; flex:none; background:var(--empty); }
.dot.up { background:var(--ok); } .dot.down { background:var(--accent); }
.dot.pending { background:var(--warn); }
.mon-state { font-family:'JetBrains Mono',ui-monospace,monospace; font-size:12px;
             letter-spacing:.06em; text-transform:uppercase; color:var(--ink-faint); }
.mon-state.up { color:var(--ok); } .mon-state.down { color:var(--accent); }
.mon-state.pending { color:var(--warn); }
.mon-url { font-size:13px; color:var(--ink-faint); word-break:break-all; margin-top:2px; }

/* 心跳条：窄栏里放不下就自己横向滚，不允许把整页撑出横向滚动条 */
.bar-scroll { overflow-x:auto; margin:var(--s3) 0 var(--s2); padding-bottom:var(--s1); }
.bar { display:flex; gap:2px; align-items:flex-end; min-width:min-content; height:30px; }
.beat { width:5px; flex:none; height:100%; background:var(--empty); cursor:default; }
.beat.ok { background:var(--ok); }
.beat.bad { background:var(--accent); }

.mon-foot { display:flex; gap:var(--s4); flex-wrap:wrap; font-size:13px; color:var(--ink-faint);
            font-family:'JetBrains Mono',ui-monospace,monospace; }
.mon-foot b { font-weight:500; color:var(--ink-soft); }

/* 提示框：定位同步算，不进 rAF —— 后台标签页里 rAF 是暂停的，
   任何把「位置」交给下一帧的写法都会让它停在左上角。 */
#tip {
    position:fixed; z-index:50; pointer-events:none; opacity:0;
    background:var(--ink); color:var(--paper); padding:var(--s2) var(--s3);
    font-size:12px; line-height:1.7; font-family:'JetBrains Mono',ui-monospace,monospace;
    white-space:pre; max-width:80vw;
    transition:opacity .12s var(--ease-ui);
}
#tip.show { opacity:1; }

/* ── 表单 ── */
form.mon-form { display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr));
                gap:var(--s3); margin-top:var(--s3); }
label { display:block; font-size:12px; color:var(--ink-faint); margin-bottom:var(--s1); }
input, select {
    font:inherit; font-size:14px; width:100%; padding:var(--s2);
    background:var(--field-bg); color:var(--ink);
    border:1px solid var(--field-border); border-radius:0;
}
input:focus, select:focus { outline:2px solid var(--accent); outline-offset:-1px; }
.btns { display:flex; gap:var(--s2); margin-top:var(--s3); flex-wrap:wrap; }
button.act {
    font:inherit; font-size:14px; padding:var(--s2) var(--s3); cursor:pointer;
    background:var(--chip); color:var(--ink); border:1px solid var(--rule-strong);
    transition:background .2s var(--ease-ui);
}
button.act:hover { background:var(--hover); }
button.act.danger { color:var(--accent); }
button.act:disabled { opacity:.45; cursor:default; }

.msg { font-size:13px; margin-top:var(--s2); }
.msg.bad { color:var(--accent); } .msg.ok { color:var(--ok); }
.empty { color:var(--ink-faint); font-size:14px; }

.inc { padding:var(--s3) 0; border-bottom:1px solid var(--rule); font-size:14px; }
.inc:last-child { border-bottom:0; }
.inc-head { display:flex; justify-content:space-between; gap:var(--s3); align-items:baseline; }
.inc-cause { color:var(--ink-faint); font-size:13px; font-family:'JetBrains Mono',ui-monospace,monospace; }

/* ── 手记编辑器 ── */
.note-row { display:flex; justify-content:space-between; align-items:baseline; gap:var(--s3);
            padding:var(--s2) 0; border-bottom:1px solid var(--rule); cursor:pointer; font-size:15px; }
.note-row:last-child { border-bottom:0; }
.note-row:hover { background:var(--hover); }
.note-row.on { color:var(--accent); }
.note-row .meta { font-family:'JetBrains Mono',ui-monospace,monospace; font-size:12px;
                  color:var(--ink-faint); white-space:nowrap; }
.badge { font-size:11px; letter-spacing:.05em; padding:1px var(--s1);
         background:var(--chip); color:var(--ink-faint); }
.badge.pub { color:var(--ok); }

#editor { margin-top:var(--s5); }
#md { width:100%; min-height:340px; resize:vertical; line-height:1.85;
      font-family:'JetBrains Mono',ui-monospace,monospace; font-size:13.5px; }
.split { display:grid; grid-template-columns:1fr 1fr; gap:var(--s4); align-items:start; }
@media (max-width:760px) { .split { grid-template-columns:1fr; } }
#preview { border:1px solid var(--rule); padding:var(--s3); min-height:340px;
           max-height:60vh; overflow:auto; font-size:14.5px; line-height:1.9; }
#preview h3,#preview h4,#preview h5 { margin-top:var(--s3); font-weight:500; }
#preview p { margin-top:var(--s2); color:var(--ink-soft); }
#preview p:first-child { margin-top:0; }
#preview code { font-family:'JetBrains Mono',ui-monospace,monospace; font-size:.85em;
                background:var(--chip); padding:1px 3px; }
#preview pre { margin-top:var(--s2); padding:var(--s2); background:var(--chip); overflow-x:auto; }
#preview pre code { background:none; padding:0; }
#preview blockquote { margin-top:var(--s2); padding-left:var(--s3);
                      border-left:2px solid var(--rule-strong); color:var(--ink-faint); }
#preview ul,#preview ol { margin-top:var(--s2); padding-left:1.4em; color:var(--ink-soft); }
#preview a { color:var(--accent); }
#preview img { max-width:100%; }
.hint { font-size:12px; color:var(--ink-faint); margin-top:var(--s1); }

footer { margin-top:var(--s8); padding-top:var(--s4); border-top:1px solid var(--rule);
         color:var(--ink-faint); font-size:13px; }
a { color:var(--accent); text-decoration:none; border-bottom:1px solid transparent;
    transition:border-color .2s var(--ease-ui); }
a:hover { border-bottom-color:currentColor; }
</style>
</head>
<body>
<div class="wrap">

<header>
    <h1>后台</h1>
    <!-- 默认就写着「正在确认」而不是留空：拿不到数据时页面也说得清自己的状态。
         绝不让内容的可见性依赖于脚本跑通。 -->
    <div class="sub" id="who">正在确认身份…</div>
</header>

<nav id="nav">
    <button data-tab="overview" class="on">概览</button>
    <button data-tab="monitors">监控</button>
    <button data-tab="incidents">事件</button>
    <button data-tab="notes">手记</button>
    <button data-tab="settings">设置</button>
</nav>

<section class="panel" id="tab-overview">
    <h2>自检</h2>
    <div class="row"><span class="k">数据库</span><span class="v" id="db">…</span></div>
    <div class="row"><span class="k">Access 配置</span><span class="v" id="access">…</span></div>
    <div class="row"><span class="k">邮箱白名单</span><span class="v" id="allow">…</span></div>
    <div class="row"><span class="k">定时探测</span><span class="v" id="cron">…</span></div>
    <div class="row"><span class="k">服务端时间</span><span class="v" id="now">…</span></div>
    <div class="btns"><button class="act" id="tgtest">发一条测试告警</button></div>
    <div class="msg" id="tgmsg"></div>
</section>

<section class="panel" id="tab-monitors" hidden>
    <h2>监控</h2>
    <div id="mons"><p class="empty">读取中…</p></div>
</section>

<section class="panel" id="tab-incidents" hidden>
    <h2>事件</h2>
    <div id="incs"><p class="empty">读取中…</p></div>
</section>

<section class="panel" id="tab-notes" hidden>
    <h2>手记</h2>
    <div id="notelist"><p class="empty">读取中…</p></div>
    <div class="btns"><button class="act" id="newnote">写一篇新的</button></div>

    <div id="editor" hidden>
        <form class="mon-form">
            <div><label for="n-title">标题</label><input id="n-title" maxlength="120"></div>
            <div><label for="n-date">日期</label><input id="n-date" type="date"></div>
            <div><label for="n-slug">标识（URL 用，小写字母数字连字符）</label><input id="n-slug" maxlength="80"></div>
        </form>
        <div class="split" style="margin-top:var(--s3)">
            <div>
                <label for="md">正文（Markdown）</label>
                <textarea id="md" spellcheck="false"></textarea>
                <div class="hint">中英文之间自动补空格，首段首字自动下沉。</div>
            </div>
            <div>
                <label>预览</label>
                <!-- 预览走服务端的 /v1/preview，和发布用的是同一个 render()。
                     在浏览器里另写一份渲染，迟早会出现「预览好好的，发出去不一样」。 -->
                <div id="preview"></div>
            </div>
        </div>
        <div class="btns">
            <button class="act" id="n-save">保存草稿</button>
            <button class="act" id="n-pub">发布</button>
            <button class="act" id="n-unpub" hidden>撤回为草稿</button>
            <button class="act danger" id="n-del" hidden>删除</button>
            <button class="act" id="n-close">关闭</button>
        </div>
        <div class="msg" id="n-msg"></div>
    </div>
</section>

<section class="panel" id="tab-settings" hidden>
    <h2>监控配置</h2>
    <div id="setlist"><p class="empty">读取中…</p></div>
    <h2 style="margin-top:var(--s6)">新增监控</h2>
    <form class="mon-form" id="addform">
        <div><label for="a-name">名称</label><input id="a-name" required maxlength="80"></div>
        <div><label for="a-url">地址</label><input id="a-url" type="url" required placeholder="https://"></div>
        <div><label for="a-kw">关键字（可空）</label><input id="a-kw" maxlength="200"></div>
        <div><label for="a-int">间隔（秒）</label><input id="a-int" type="number" value="300" min="60" max="86400"></div>
    </form>
    <div class="btns"><button class="act" id="addbtn">新增</button></div>
    <div class="msg" id="addmsg"></div>
</section>

<footer>
    沐枫的管理后台 · <a href="https://sakuramu.edu.kg">主页</a> ·
    <a href="https://about.sakuramu.edu.kg">关于</a>
</footer>

</div>
<div id="tip"></div>

<script>
'use strict';
var $ = function (id) { return document.getElementById(id); };
var esc = function (s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
        return ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' })[c];
    });
};
var pct = function (v) { return v == null ? '—' : (v * 100).toFixed(v === 1 ? 0 : 2) + '%'; };
var clock = function (ms) {
    if (!ms) return '—';
    var d = new Date(ms), p = function (n) { return (n < 10 ? '0' : '') + n; };
    return p(d.getMonth()+1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds());
};
var ago = function (ms, now) {
    if (!ms) return '从未';
    var s = Math.max(0, Math.round((now - ms) / 1000));
    if (s < 60) return s + ' 秒前';
    if (s < 3600) return Math.round(s / 60) + ' 分钟前';
    if (s < 86400) return Math.round(s / 3600) + ' 小时前';
    return Math.round(s / 86400) + ' 天前';
};

// ── 标签页 ──
$('nav').addEventListener('click', function (e) {
    var b = e.target.closest('button[data-tab]');
    if (!b) return;
    var tabs = $('nav').querySelectorAll('button');
    for (var i = 0; i < tabs.length; i++) {
        tabs[i].classList.toggle('on', tabs[i] === b);
        $('tab-' + tabs[i].dataset.tab).hidden = tabs[i] !== b;
    }
    if (b.dataset.tab === 'incidents') loadIncidents();
    if (b.dataset.tab === 'notes') loadNotes();
});

// ── 提示框 ──
// 位置同步计算，不排进 rAF：后台标签页里 rAF 是暂停的，
// 把定位交给下一帧的写法会让提示框停在左上角。
var tip = $('tip');
function showTip(el, text) {
    tip.textContent = text;
    tip.classList.add('show');
    var r = el.getBoundingClientRect(), t = tip.getBoundingClientRect();
    var x = r.left + r.width / 2 - t.width / 2;
    x = Math.max(8, Math.min(x, innerWidth - t.width - 8));
    var y = r.top - t.height - 8;
    if (y < 8) y = r.bottom + 8;
    tip.style.left = x + 'px';
    tip.style.top = y + 'px';
}
function hideTip() { tip.classList.remove('show'); }

// ── 概览 ──
function loadHealth() {
    fetch('/healthz', { headers: { accept: 'application/json' } })
        .then(function (r) { return r.json(); })
        .then(function (d) {
            set('db', d.db, d.db === 'ok' ? 'ok' : 'bad');
            set('access', d.access === 'configured' ? '已配置' : '未配置（写接口全部拒绝）',
                d.access === 'configured' ? 'ok' : 'warn');
            set('allow', d.email_allowlist === 'on' ? '已开启' : '未设置（仅依赖 Access 策略）',
                d.email_allowlist === 'on' ? 'ok' : 'warn');
            set('now', String(d.now || '').replace('T', ' ').slice(0, 19));
        })
        .catch(function () { ['db','access','allow','now'].forEach(function (k) { set(k, '取不到', 'bad'); }); });
}
function set(id, text, cls) {
    var el = $(id); if (!el) return;
    el.textContent = text; el.className = 'v' + (cls ? ' ' + cls : '');
}

// ── 监控 ──
var STATE_CN = { up: '正常', down: '故障', pending: '观察中' };
function loadMonitors() {
    return fetch('/v1/monitors', { headers: { accept: 'application/json' } })
        .then(function (r) { return r.json(); })
        .then(function (d) { renderMonitors(d); renderSettings(d); return d; })
        .catch(function () {
            $('mons').innerHTML = '<p class="empty">读不到监控数据。</p>';
            $('setlist').innerHTML = '<p class="empty">读不到监控数据。</p>';
        });
}

function renderMonitors(d) {
    var now = d.now, list = d.monitors || [];

    // 调度器自身的状态。心跳停了和「一直很健康」在界面上长得几乎一样，
    // 所以这一行必须显眼：超过 3 分钟没调度就报警告。
    var c = d.cron || {};
    var stale = !c.last_run_at || (now - c.last_run_at) > 180000;
    set('cron', c.last_run_at ? (ago(c.last_run_at, now) + '（' + (c.last_result || '') + '）') : '从未运行',
        stale ? 'bad' : 'ok');

    if (!list.length) { $('mons').innerHTML = '<p class="empty">还没有监控，去「设置」里加一个。</p>'; return; }

    $('mons').innerHTML = list.map(function (m) {
        var hb = m.heartbeats || [];
        var beats = hb.map(function (b) {
            var cls = b.ok ? 'ok' : 'bad';
            var t = clock(b.ts) + '\n' + (b.ok ? '正常' : '故障')
                  + (b.code != null ? ' · HTTP ' + b.code : '')
                  + (b.ms != null ? ' · ' + b.ms + 'ms' : '')
                  + (b.err ? '\n' + b.err : '');
            return '<div class="beat ' + cls + '" data-tip="' + esc(t) + '"></div>';
        }).join('');
        // 不足 60 个用占位补齐，让所有心跳条等宽、右端对齐
        var pad = '';
        for (var i = hb.length; i < 60; i++) pad += '<div class="beat" data-tip="暂无数据"></div>';

        var st = m.state || 'pending';
        return '<div class="mon">'
            + '<div class="mon-top">'
            +   '<div class="mon-name"><span class="dot ' + st + '"></span>' + esc(m.name) + '</div>'
            +   '<div class="mon-state ' + st + '">' + (STATE_CN[st] || st) + '</div>'
            + '</div>'
            + '<div class="mon-url">' + esc(m.url) + '</div>'
            + '<div class="bar-scroll"><div class="bar">' + pad + beats + '</div></div>'
            + '<div class="mon-foot">'
            +   '<span>24h 可用率 <b>' + pct(m.uptime_24h) + '</b></span>'
            +   '<span>响应 <b>' + (m.last_ms != null ? m.last_ms + 'ms' : '—') + '</b></span>'
            +   '<span>检查 <b>' + (m.checks_24h || 0) + '</b> 次</span>'
            +   '<span>' + ago(m.last_check_at, now) + '</span>'
            +   (m.last_error ? '<span style="color:var(--accent)">' + esc(m.last_error) + '</span>' : '')
            + '</div></div>';
    }).join('');
}

// 事件委托：心跳格子有上千个，逐个挂监听器不划算
document.addEventListener('mouseover', function (e) {
    var b = e.target.closest('.beat');
    if (b) showTip(b, b.dataset.tip);
});
document.addEventListener('mouseout', function (e) {
    if (e.target.closest('.beat')) hideTip();
});

// ── 事件 ──
function loadIncidents() {
    fetch('/v1/incidents', { headers: { accept: 'application/json' } })
        .then(function (r) { return r.json(); })
        .then(function (d) {
            var l = d.incidents || [];
            if (!l.length) { $('incs').innerHTML = '<p class="empty">还没有故障记录。</p>'; return; }
            $('incs').innerHTML = l.map(function (i) {
                var dur = i.resolved_at
                    ? Math.max(1, Math.round((i.resolved_at - i.started_at) / 60000)) + ' 分钟'
                    : '进行中';
                return '<div class="inc"><div class="inc-head">'
                    + '<b>' + esc(i.monitor_name || ('#' + i.monitor_id)) + '</b>'
                    + '<span class="inc-cause">' + clock(i.started_at) + ' · ' + dur + '</span>'
                    + '</div><div class="inc-cause">' + esc(i.cause || '') + '</div></div>';
            }).join('');
        })
        .catch(function () { $('incs').innerHTML = '<p class="empty">读不到事件。</p>'; });
}

// ── 设置 ──
function renderSettings(d) {
    var list = d.monitors || [];
    if (!list.length) { $('setlist').innerHTML = '<p class="empty">还没有监控。</p>'; return; }
    $('setlist').innerHTML = list.map(function (m) {
        return '<div class="mon" data-id="' + m.id + '">'
            + '<div class="mon-name">' + esc(m.name) + '</div>'
            + '<form class="mon-form">'
            +   fld(m.id, 'name', '名称', m.name, 'text')
            +   fld(m.id, 'url', '地址', m.url, 'url')
            +   fld(m.id, 'expect_keyword', '关键字（可空）', m.expect_keyword || '', 'text')
            +   fld(m.id, 'interval_s', '间隔（秒）', m.interval_s, 'number')
            +   fld(m.id, 'timeout_ms', '超时（毫秒）', m.timeout_ms, 'number')
            +   fld(m.id, 'retries', '重试次数', m.retries, 'number')
            + '</form>'
            + '<div class="btns">'
            +   '<button class="act" data-act="save" data-id="' + m.id + '">保存</button>'
            +   '<button class="act" data-act="check" data-id="' + m.id + '">立刻探测</button>'
            +   '<button class="act" data-act="toggle" data-id="' + m.id + '">'
            +      (m.enabled ? '停用' : '启用') + '</button>'
            +   '<button class="act danger" data-act="del" data-id="' + m.id + '">删除</button>'
            + '</div><div class="msg" id="msg-' + m.id + '"></div></div>';
    }).join('');
}
function fld(id, key, label, val, type) {
    return '<div><label for="f-' + id + '-' + key + '">' + label + '</label>'
         + '<input id="f-' + id + '-' + key + '" data-key="' + key + '" type="' + type + '" value="' + esc(val) + '"></div>';
}

$('tab-settings').addEventListener('click', function (e) {
    var b = e.target.closest('button[data-act]');
    if (!b) return;
    e.preventDefault();
    var id = b.dataset.id, msg = $('msg-' + id), card = b.closest('.mon');
    var say = function (t, cls) { msg.textContent = t; msg.className = 'msg ' + (cls || ''); };

    if (b.dataset.act === 'del') {
        if (!confirm('删除这个监控？它的心跳和事件记录会一并删除，不可恢复。')) return;
        api('DELETE', '/v1/monitors/' + id).then(function () { loadMonitors(); })
            .catch(function (err) { say(err.message, 'bad'); });
        return;
    }
    if (b.dataset.act === 'check') {
        say('探测中…');
        api('POST', '/v1/monitors/' + id + '/check').then(function (d) {
            var r = d.result;
            say((r.ok ? '✓ 正常' : '✗ 失败') + ' · ' + (r.code != null ? 'HTTP ' + r.code + ' · ' : '')
                + r.ms + 'ms' + (r.err ? ' · ' + r.err : '') + '（只探测，不写入记录）',
                r.ok ? 'ok' : 'bad');
        }).catch(function (err) { say(err.message, 'bad'); });
        return;
    }
    var body = {};
    if (b.dataset.act === 'toggle') {
        body.enabled = b.textContent.trim() === '启用' ? 1 : 0;
    } else {
        var ins = card.querySelectorAll('input[data-key]');
        for (var i = 0; i < ins.length; i++) {
            var k = ins[i].dataset.key, v = ins[i].value;
            if (ins[i].type === 'number') body[k] = Number(v);
            else if (k === 'expect_keyword') body[k] = v.trim() === '' ? null : v;
            else body[k] = v;
        }
    }
    say('保存中…');
    api('PATCH', '/v1/monitors/' + id, body)
        .then(function () { say('已保存', 'ok'); loadMonitors(); })
        .catch(function (err) { say(err.message, 'bad'); });
});

$('addbtn').addEventListener('click', function (e) {
    e.preventDefault();
    var msg = $('addmsg');
    var kw = $('a-kw').value.trim();
    var body = {
        name: $('a-name').value, url: $('a-url').value,
        interval_s: Number($('a-int').value),
    };
    if (kw) body.expect_keyword = kw;
    msg.textContent = '新增中…'; msg.className = 'msg';
    api('POST', '/v1/monitors', body).then(function () {
        msg.textContent = '已新增'; msg.className = 'msg ok';
        $('a-name').value = ''; $('a-url').value = ''; $('a-kw').value = '';
        loadMonitors();
    }).catch(function (err) { msg.textContent = err.message; msg.className = 'msg bad'; });
});

function api(method, path, body) {
    return fetch(path, {
        method: method,
        headers: body ? { 'content-type': 'application/json' } : {},
        body: body ? JSON.stringify(body) : undefined,
    }).then(function (r) {
        return r.json().catch(function () { return {}; }).then(function (d) {
            if (r.ok) return d;
            var detail = Array.isArray(d.detail) ? d.detail.join('；') : (d.detail || d.error || ('HTTP ' + r.status));
            throw new Error(detail);
        });
    });
}

// ── 身份 ──
fetch('/v1/whoami', { headers: { accept: 'application/json' } })
    .then(function (r) { return r.json().then(function (d) { return { s: r.status, d: d }; }); })
    .then(function (x) {
        var el = $('who');
        if (x.s === 200 && x.d.email) el.textContent = x.d.email;
        else if (x.s === 503) el.textContent = 'Access 尚未配置 —— 写接口已全部关闭';
        else el.textContent = '身份未通过校验（HTTP ' + x.s + '）';
    })
    .catch(function () { $('who').textContent = '身份接口不可达'; });

// ── 手记 ──
var curSlug = null, curIsNew = false;

function loadNotes() {
    return api('GET', '/v1/notes').then(function (d) {
        var l = d.notes || [];
        if (!l.length) { $('notelist').innerHTML = '<p class="empty">还没有手记。</p>'; return; }
        $('notelist').innerHTML = l.map(function (n) {
            return '<div class="note-row' + (n.slug === curSlug ? ' on' : '') + '" data-slug="' + esc(n.slug) + '">'
                 + '<span>' + esc(n.title) + '</span>'
                 + '<span class="meta">' + esc(n.date) + ' · '
                 + '<span class="badge' + (n.published ? ' pub' : '') + '">'
                 + (n.published ? '已发布' : '草稿') + '</span></span></div>';
        }).join('');
    }).catch(function () { $('notelist').innerHTML = '<p class="empty">读不到手记。</p>'; });
}

$('notelist').addEventListener('click', function (e) {
    var row = e.target.closest('.note-row');
    if (!row) return;
    openNote(row.dataset.slug);
});

function openNote(slug) {
    api('GET', '/v1/notes/' + encodeURIComponent(slug)).then(function (n) {
        curSlug = n.slug; curIsNew = false;
        $('n-title').value = n.title; $('n-date').value = n.date;
        $('n-slug').value = n.slug; $('n-slug').disabled = true;
        $('md').value = n.md;
        $('n-pub').hidden = !!n.published;
        $('n-unpub').hidden = !n.published;
        $('n-del').hidden = false;
        $('editor').hidden = false;
        say('');
        preview();
        loadNotes();
        $('editor').scrollIntoView({ block: 'nearest' });
    }).catch(function (err) { say(err.message, 'bad'); });
}

$('newnote').addEventListener('click', function (e) {
    e.preventDefault();
    curSlug = null; curIsNew = true;
    $('n-title').value = ''; $('n-slug').value = ''; $('n-slug').disabled = false;
    $('n-date').value = new Date().toISOString().slice(0, 10);
    $('md').value = '';
    $('n-pub').hidden = false; $('n-unpub').hidden = true; $('n-del').hidden = true;
    $('editor').hidden = false; $('preview').innerHTML = ''; say('');
    $('n-title').focus();
});

$('n-close').addEventListener('click', function (e) {
    e.preventDefault(); $('editor').hidden = true; curSlug = null; loadNotes();
});

function say(t, cls) { var m = $('n-msg'); m.textContent = t; m.className = 'msg ' + (cls || ''); }

// 预览防抖。每敲一个字就请求一次服务端毫无必要，也白烧配额。
var pvTimer = null;
function preview() {
    clearTimeout(pvTimer);
    pvTimer = setTimeout(function () {
        var md = $('md').value;
        if (!md.trim()) { $('preview').innerHTML = ''; return; }
        api('POST', '/v1/preview', { md: md })
            .then(function (d) { $('preview').innerHTML = d.html; })
            .catch(function () { /* 预览失败不打扰，继续写就是了 */ });
    }, 400);
}
$('md').addEventListener('input', preview);

// 标题变化时顺手给个 slug 建议，但只在新建且用户没自己填过时
$('n-title').addEventListener('input', function () {
    if (!curIsNew || $('n-slug').dataset.touched) return;
    api('POST', '/v1/slug', { title: $('n-title').value })
        .then(function (d) { if (!$('n-slug').dataset.touched) $('n-slug').value = d.slug; })
        .catch(function () {});
});
$('n-slug').addEventListener('input', function () { $('n-slug').dataset.touched = '1'; });

function saveNote(published) {
    var slug = (curSlug || $('n-slug').value || '').trim();
    if (!/^[a-z0-9](?:[a-z0-9-]{0,78}[a-z0-9])?$/.test(slug)) {
        say('标识只能用小写字母、数字和连字符，且不能以连字符开头或结尾', 'bad'); return;
    }
    var body = {
        title: $('n-title').value, date: $('n-date').value,
        md: $('md').value, published: published ? 1 : 0,
    };
    say('保存中…');
    api('PUT', '/v1/notes/' + encodeURIComponent(slug), body).then(function (n) {
        curSlug = n.slug; curIsNew = false; $('n-slug').disabled = true;
        $('n-pub').hidden = !!n.published; $('n-unpub').hidden = !n.published;
        $('n-del').hidden = false;
        say(n.published ? '已发布，关于页一分钟内更新' : '草稿已保存', 'ok');
        loadNotes();
    }).catch(function (err) { say(err.message, 'bad'); });
}
$('n-save').addEventListener('click', function (e) { e.preventDefault(); saveNote(false); });
$('n-pub').addEventListener('click', function (e) { e.preventDefault(); saveNote(true); });
$('n-unpub').addEventListener('click', function (e) { e.preventDefault(); saveNote(false); });

$('n-del').addEventListener('click', function (e) {
    e.preventDefault();
    if (!curSlug || !confirm('删除《' + $('n-title').value + '》？不可恢复。')) return;
    api('DELETE', '/v1/notes/' + encodeURIComponent(curSlug)).then(function () {
        $('editor').hidden = true; curSlug = null; loadNotes();
    }).catch(function (err) { say(err.message, 'bad'); });
});

$('tgtest').addEventListener('click', function (e) {
    e.preventDefault();
    var m = $('tgmsg');
    m.textContent = '发送中…'; m.className = 'msg';
    api('POST', '/v1/notify/test')
        .then(function () { m.textContent = '已发送，去 Telegram 看一眼'; m.className = 'msg ok'; })
        .catch(function (err) { m.textContent = '发送失败：' + err.message; m.className = 'msg bad'; });
});

loadHealth();
loadMonitors();
// 30 秒刷新一次。页面在后台时不刷 —— 没人看的时候没必要占配额。
setInterval(function () {
    if (!document.hidden) { loadHealth(); loadMonitors(); }
}, 30000);
</script>
</body>
</html>
